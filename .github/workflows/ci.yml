name: Backend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kultiva_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kultiva_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kultiva_db
      NASA_PROVIDER: mock
      ALERT_MONITOR_INTERVAL_HOURS: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system geospatial and PostgreSQL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest suite
        run: pytest backend/tests -v
